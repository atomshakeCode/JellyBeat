name: Build JellyBeat 0.7.1

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'native/**'
      - 'build.py'
      - '.github/workflows/**'
      - 'scripts/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Check out published source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download pinned build dependencies
        shell: pwsh
        run: python scripts/prepare_build.py

      - name: Build Windows WASAPI helper from source
        shell: pwsh
        run: ./native/build.ps1

      - name: Build the mod JAR from source
        shell: pwsh
        run: |
          $jdk = (Get-Command javac).Source | Split-Path | Split-Path
          python build.py --jdk $jdk --meta build/meta --fabric-api build/deps/fabric-api.jar --voicechat build/deps/voicechat.jar

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $jar = 'build/jellybeat-0.7.1+26.2.jar'
          $helper = 'src/main/resources/native/windows-x64/jellybeat-capture.exe'
          Get-FileHash $jar,$helper -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path)" } | Set-Content build/SHA256SUMS.txt
          Get-Content build/SHA256SUMS.txt

      - name: Publish reviewable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JellyBeat-0.7.1-verified-build
          path: |
            build/jellybeat-0.7.1+26.2.jar
            build/SHA256SUMS.txt
            src/main/resources/native/windows-x64/jellybeat-capture.exe
          if-no-files-found: error



